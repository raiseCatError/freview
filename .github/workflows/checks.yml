name: freview checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-snapshot:
    name: Python/Git snapshot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check optional helper syntax
        run: python3 -m py_compile skills/freview/scripts/repo_snapshot.py
      - name: Run no-dependency fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Exercise read-only local snapshot
        run: python3 skills/freview/scripts/repo_snapshot.py --json > /dev/null
      - name: Check repository diff
        run: git diff --exit-code --check
