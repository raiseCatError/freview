# OPT-IN template: copy into a target repository's .github/workflows/ and review first.
# Requires a reviewed/pinned project-local freview skill at
# .agents/skills/freview/scripts/repo_snapshot.py (commit it or vendor it deliberately).
# This is a local structural snapshot, NOT a complete agent-driven repository review.
# Artifact uploads are disabled unless FREVIEW_UPLOAD_ARTIFACT repo variable is true.
name: freview daily structural snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Collect local metadata only
        run: |
          helper=.agents/skills/freview/scripts/repo_snapshot.py
          if [ ! -f "$helper" ]; then
            echo "::error::Install a reviewed project-local freview skill at $helper before enabling this workflow."
            exit 1
          fi
          python3 "$helper" --json > freview-local.json
      # Artifacts can reveal branch names, local paths and repo metadata.
      # Off by default; users must explicitly set this repo variable to 'true'.
      - name: Upload reviewed metadata artifact
        if: ${{ vars.FREVIEW_UPLOAD_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freview-local-snapshot
          path: freview-local.json
          retention-days: 7
